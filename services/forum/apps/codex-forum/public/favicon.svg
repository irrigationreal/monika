<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d060"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#a08020"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" rx="16" fill="#111111"/>
  <!-- Robot head outline -->
  <rect x="20" y="30" width="60" height="50" rx="8" fill="url(#gold)"/>
  <!-- Eyes -->
  <circle cx="35" cy="50" r="8" fill="#111111"/>
  <circle cx="65" cy="50" r="8" fill="#111111"/>
  <circle cx="35" cy="50" r="4" fill="#f0d060"/>
  <circle cx="65" cy="50" r="4" fill="#f0d060"/>
  <!-- Antenna -->
  <rect x="46" y="15" width="8" height="18" rx="2" fill="url(#gold)"/>
  <circle cx="50" cy="12" r="6" fill="#f0d060"/>
  <!-- Mouth grill -->
  <rect x="32" y="62" width="36" height="10" rx="3" fill="#111111"/>
  <rect x="36" y="65" width="6" height="4" rx="1" fill="#d4af37"/>
  <rect x="47" y="65" width="6" height="4" rx="1" fill="#d4af37"/>
  <rect x="58" y="65" width="6" height="4" rx="1" fill="#d4af37"/>
</svg>
