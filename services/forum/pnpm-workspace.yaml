packages:
  - apps/*
  - packages/*

# pnpm 11's portable deploy implementation requires injected workspace packages.
injectWorkspacePackages: true

minimumReleaseAge: 14400
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@earendil-works/*'
  # Mermaid 11.16.1 fixes a host-realm architecture parser prototype-pollution bug in 11.16.0.
  - mermaid

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: false

overrides:
  '@fastify/busboy': 3.2.2
  '@isaacs/brace-expansion': '>=5.0.12'
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  '@vue/server-renderer': 3.5.42
  dompurify: 3.4.16
  'fast-uri@3': 3.1.8
  fast-uri: 3.1.8
  fastify: 5.12.5
  fast-xml-parser: '>=5.3.4'
  'find-my-way@9': 9.7.0
  'js-yaml@4': 4.3.2
  katex: 0.18.2
  lodash: 4.18.1
  nanoid: 3.3.18
  nodemailer: 10.0.9
  'postcss-selector-parser': 7.1.6
  'postcss@8': 8.5.23
  sharp: 0.35.5
  source-map-js: 1.2.2
  'undici@6': 6.28.1
