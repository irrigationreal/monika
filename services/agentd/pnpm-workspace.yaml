packages:
  - .

minimumReleaseAge: 14400
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@earendil-works/*'
  # Pi 1.1.0 pins this SDK; reviewed with the coordinated Pi upgrade.
  - '@anthropic-ai/sdk@0.129.0'

overrides:
  protobufjs: 7.6.5

allowBuilds:
  '@google/genai': false
  protobufjs: false
  # Chord's bundler is not used by agentd's published local SDK.
  esbuild: false
