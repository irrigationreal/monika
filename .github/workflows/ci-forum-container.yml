# Forum CI — test the forum application and build the forum image.
#
# This follows the branch-protection pattern used by Vesper: a changes job
# decides whether the expensive job should run, the build job can fail, and a
# stable checks job is the required branch-rule gate.

name: CI / Forum Container

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-forum-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forum-container-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'services/forum/Containerfile' \
              'services/forum/.dockerignore' \
              'services/forum/package.json' \
              'services/forum/pnpm-lock.yaml' \
              'services/forum/pnpm-workspace.yaml' \
              'services/forum/apps/' \
              'services/forum/packages/' \
              'services/forum/tsconfig.json' \
              'tests/forum/' \
              'tests/smoke/forum-runtime.sh' \
              '.github/workflows/ci-forum-container.yml' \
              '.github/workflows/image-forum.yml' \
            | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  forum-container-build:
    needs: forum-container-changes
    if: needs.forum-container-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Run forum unit/integration tests
        run: tests/forum/unit.sh

      - name: Run forum E2E tests
        run: tests/forum/e2e.sh

      - name: Build forum image
        run: |
          docker build \
            -f services/forum/Containerfile \
            --build-arg MONIKA_BUILD_COMMIT=${{ github.sha }} \
            --build-arg MONIKA_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }} \
            --build-arg MONIKA_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t monika-forum-test \
            ./services/forum

      - name: Smoke-test forum runtime image
        run: tests/smoke/forum-runtime.sh monika-forum-test

  # Gate job — branch protection should require this check.
  forum-container-checks:
    if: always()
    needs: [forum-container-changes, forum-container-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.forum-container-build.result }}" = "failure" ] || [ "${{ needs.forum-container-build.result }}" = "cancelled" ]; then
            echo "Forum build/tests failed or were cancelled"
            exit 1
          fi

          echo "Forum build/tests passed or were skipped (no relevant changes)"
