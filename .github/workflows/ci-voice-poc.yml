name: CI / Realtime Voice POC

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-voice-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  voice-poc-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")
          if [ -z "$BASE" ] || git diff --name-only "$BASE" "${{ github.sha }}" -- \
            'services/voice/' \
            'services/agentd/src/voice-adapter.mjs' \
            'services/agentd/src/memstore-rpc.mjs' \
            'services/agentd/test/memstore-rpc.test.mjs' \
            'services/agentd/src/server.mjs' \
            'services/agentd/test/voice-adapter.test.mjs' \
            'services/agentd/package.json' \
            'services/agentd/pnpm-lock.yaml' \
            'services/agentd/Containerfile.voice-poc' \
            'tests/compose.voice-poc.yaml' \
            'docs/voice.md' \
            '.github/workflows/ci-voice-poc.yml' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  voice-poc-test:
    needs: voice-poc-changes
    if: needs.voice-poc-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Install agentd dependencies
        run: corepack pnpm@11.21.0 --dir services/agentd install --frozen-lockfile
      - name: Run provider-independent voice tests
        run: |
          node --test services/agentd/test/voice-adapter.test.mjs services/agentd/test/memstore-rpc.test.mjs services/agentd/test/health-route.test.mjs
          npm --prefix services/voice test
      - name: Build voice images
        run: |
          docker build -f services/agentd/Containerfile.voice-poc -t monika-voice-runtime-poc .
          docker build -f services/voice/Containerfile -t monika-voice-poc services/voice

  voice-poc-checks:
    if: always()
    needs: [voice-poc-changes, voice-poc-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.voice-poc-changes.result }}" != "success" ]; then
            echo "Voice POC change detection failed"
            exit 1
          fi
          if [ "${{ needs.voice-poc-test.result }}" = "failure" ] || [ "${{ needs.voice-poc-test.result }}" = "cancelled" ]; then
            echo "Voice POC tests failed or were cancelled"
            exit 1
          fi
          echo "Voice POC tests passed or were skipped"
