# Forum test CI — run source-level forum tests when forum code changes.
#
# This follows the same branch-protection pattern as the container workflows:
# a changes job decides whether work is needed, the test job may fail, and a
# stable checks job is the required branch-rule gate.

name: CI / Forum Tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-forum-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forum-tests-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'services/forum/package.json' \
              'services/forum/pnpm-lock.yaml' \
              'services/forum/pnpm-workspace.yaml' \
              'services/forum/apps/' \
              'services/forum/packages/' \
              'services/forum/tsconfig.json' \
              'tests/forum/' \
              '.github/workflows/ci-forum-tests.yml' \
            | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  forum-tests:
    needs: forum-tests-changes
    if: needs.forum-tests-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Run forum unit/integration tests
        run: tests/forum/unit.sh

      - name: Run forum E2E tests
        run: tests/forum/e2e.sh

  forum-tests-checks:
    if: always()
    needs: [forum-tests-changes, forum-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.forum-tests.result }}" = "failure" ] || [ "${{ needs.forum-tests.result }}" = "cancelled" ]; then
            echo "Forum tests failed or were cancelled"
            exit 1
          fi

          echo "Forum tests passed or were skipped (no relevant changes)"
