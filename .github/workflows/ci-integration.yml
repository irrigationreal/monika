# Cross-service compatibility checks for agentd and the forum projection.

name: CI / Integration

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check for integration-relevant changes
        id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'compose.yaml' \
              'compose.yaml.example' \
              'tests/compose.monika-runtime.yaml' \
              'Containerfile' \
              'entrypoint.sh' \
              'config/extensions/' \
              'services/agentd/' \
              'services/forum/' \
              'tests/integration/' \
              '.github/workflows/ci-integration.yml' \
            | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  integration-build:
    needs: integration-changes
    if: needs.integration-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install cross-service dependencies
        run: |
          pnpm --dir services/agentd install --frozen-lockfile
          pnpm --dir services/forum install --frozen-lockfile

      - name: Run agentd/forum fork-boundary contract test
        run: tests/integration/fork-boundary-contract.sh

  # Gate job — branch protection should require this check.
  integration-checks:
    if: always()
    needs: [integration-changes, integration-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.integration-changes.result }}" != "success" ]; then
            echo "Integration change detection did not complete successfully"
            exit 1
          fi

          if [ "${{ needs.integration-build.result }}" = "failure" ] || [ "${{ needs.integration-build.result }}" = "cancelled" ]; then
            echo "Integration checks failed or were cancelled"
            exit 1
          fi

          echo "Integration checks passed or were skipped (no relevant changes)"
