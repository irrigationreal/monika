# Integration CI placeholder.
#
# This workflow intentionally does not run real integration tests yet. It exists
# so branch protection can require a stable integration gate today, and so future
# agentd/forum compatibility tests have a documented place to grow.

name: CI / Integration

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for integration-relevant changes
        id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'compose.yaml' \
              'compose.yaml.example' \
              'tests/compose.monika-runtime.yaml' \
              'Containerfile' \
              'entrypoint.sh' \
              'config/extensions/' \
              'services/agentd/' \
              'services/forum/' \
              '.github/workflows/ci-integration.yml' \
            | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  integration-placeholder:
    needs: integration-changes
    if: needs.integration-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder integration test
        run: |
          echo "No integration checks are implemented yet."
          echo "Future checks should exercise agentd + forum compatibility here."

  # Gate job — branch protection should require this check.
  integration-checks:
    if: always()
    needs: [integration-changes, integration-placeholder]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.integration-placeholder.result }}" = "failure" ] || [ "${{ needs.integration-placeholder.result }}" = "cancelled" ]; then
            echo "Integration checks failed or were cancelled"
            exit 1
          fi

          echo "Integration checks passed or were skipped (no relevant changes)"
