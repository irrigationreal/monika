# Docker build CI — smoke-test that container images build successfully.
#
# Runs native Docker builds without pushing. This catches Dockerfile,
# build-context, and .dockerignore issues before a branch lands on main and
# starts publishing GHCR images.

name: CI / Containers

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["*"]
  pull_request:

concurrency:
  group: ci-containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-changes:
    runs-on: ubuntu-latest
    outputs:
      monika: ${{ steps.check.outputs.monika }}
      forum: ${{ steps.check.outputs.forum }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        shell: bash
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "monika=true" >> "$GITHUB_OUTPUT"
            echo "forum=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'Containerfile' \
              '.dockerignore' \
              'bin/' \
              'config/' \
              'entrypoint.sh' \
              'host-shell' \
              'scripts/' \
              'services/agentd/' \
              'services/memstore/' \
              '.github/workflows/ci-containers.yml' \
              '.github/workflows/image-monika.yml' \
            | grep -qvE '\.md$'; then
            echo "monika=true" >> "$GITHUB_OUTPUT"
          else
            echo "monika=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" -- \
              'services/forum/Containerfile' \
              'services/forum/.dockerignore' \
              'services/forum/package.json' \
              'services/forum/pnpm-lock.yaml' \
              'services/forum/pnpm-workspace.yaml' \
              'services/forum/apps/' \
              'services/forum/packages/' \
              'services/forum/tsconfig.json' \
              '.github/workflows/ci-containers.yml' \
              '.github/workflows/image-forum.yml' \
            | grep -qvE '\.md$'; then
            echo "forum=true" >> "$GITHUB_OUTPUT"
          else
            echo "forum=false" >> "$GITHUB_OUTPUT"
          fi

  monika-build:
    needs: container-changes
    if: needs.container-changes.outputs.monika == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Monika runtime image
        run: docker build -f Containerfile -t monika-test .

  forum-build:
    needs: container-changes
    if: needs.container-changes.outputs.forum == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build forum image
        run: docker build -f services/forum/Containerfile -t monika-forum-test ./services/forum

  container-checks:
    if: always()
    needs: [container-changes, monika-build, forum-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        shell: bash
        run: |
          if [ "${{ needs.monika-build.result }}" = "failure" ] || [ "${{ needs.monika-build.result }}" = "cancelled" ]; then
            echo "Monika runtime Docker build failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.forum-build.result }}" = "failure" ] || [ "${{ needs.forum-build.result }}" = "cancelled" ]; then
            echo "Forum Docker build failed or was cancelled"
            exit 1
          fi

          echo "Docker builds passed or were skipped (no relevant changes)"
