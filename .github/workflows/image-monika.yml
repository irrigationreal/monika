name: Image / Monika

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - ".dockerignore"
      - "bin/**"
      - "config/**"
      - "entrypoint.sh"
      - "host-shell"
      - "scripts/**"
      - "services/agentd/**"
      - "services/memstore/**"
      - ".github/workflows/image-monika.yml"

concurrency:
  group: image-monika-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,suffix=-${{ matrix.arch }}
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=monika-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=monika-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r TAG; do
            docker buildx imagetools create \
              -t "${TAG}" \
              "${TAG}-amd64" \
              "${TAG}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
