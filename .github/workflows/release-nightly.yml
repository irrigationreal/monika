name: Release / Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

concurrency:
  group: release-nightly
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      date: ${{ steps.check.outputs.date }}
      build_date: ${{ steps.check.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly
        id: check
        shell: bash
        run: |
          DATE=$(date -u +%Y.%m.%d)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — building unconditionally."
            exit 0
          fi

          if git rev-parse nightly >/dev/null 2>&1; then
            NIGHTLY_SHA=$(git rev-parse nightly)
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$NIGHTLY_SHA" = "$HEAD_SHA" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "No changes since last nightly (${SHORT_SHA}). Skipping."
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected (nightly=${NIGHTLY_SHA:0:7} → HEAD=${SHORT_SHA})."
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No previous nightly tag found. Building."
          fi

  monika-build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}:nightly-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.check-changes.outputs.build_date }}
          build-args: |
            MONIKA_BUILD_COMMIT=${{ github.sha }}
            MONIKA_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MONIKA_BUILD_DATE=${{ needs.check-changes.outputs.build_date }}
          cache-from: type=gha,scope=monika-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=monika-${{ matrix.arch }}

  monika-manifest:
    runs-on: ubuntu-latest
    needs: [check-changes, monika-build]
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Monika runtime manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:nightly" \
            "${IMAGE}:nightly-amd64" \
            "${IMAGE}:nightly-arm64"

  forum-build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./services/forum
          file: ./services/forum/Containerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}-forum:nightly-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.check-changes.outputs.build_date }}
          build-args: |
            MONIKA_BUILD_COMMIT=${{ github.sha }}
            MONIKA_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MONIKA_BUILD_DATE=${{ needs.check-changes.outputs.build_date }}
          cache-from: type=gha,scope=forum-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forum-${{ matrix.arch }}

  forum-manifest:
    runs-on: ubuntu-latest
    needs: [check-changes, forum-build]
    if: needs.check-changes.outputs.should_build == 'true'
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create forum manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-forum
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:nightly" \
            "${IMAGE}:nightly-amd64" \
            "${IMAGE}:nightly-arm64"

  release:
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.should_build == 'true'
    needs:
      - check-changes
      - monika-manifest
      - forum-manifest
    steps:
      - uses: actions/checkout@v7

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.check-changes.outputs.date }}
          SHORT_SHA: ${{ needs.check-changes.outputs.short_sha }}
        run: |
          cat > release-notes.md <<NOTES
          ## Nightly Build — ${DATE}

          **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

          ### Container Images

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:nightly
          docker pull ghcr.io/${{ github.repository }}-forum:nightly
          \`\`\`

          These are rolling nightly images built from the latest commit on \`main\`.
          NOTES

          gh release create nightly \
            --title "Nightly Build — ${DATE}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${{ github.sha }}"
