name: Image / Forum

on:
  push:
    branches: [main]
    paths:
      - "services/forum/Containerfile"
      - "services/forum/.dockerignore"
      - "services/forum/package.json"
      - "services/forum/pnpm-lock.yaml"
      - "services/forum/pnpm-workspace.yaml"
      - "services/forum/apps/**"
      - "services/forum/packages/**"
      - "services/forum/tsconfig.json"
      - ".github/workflows/image-forum.yml"

concurrency:
  group: image-forum-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-forum
          tags: |
            type=raw,value=main,suffix=-${{ matrix.arch }}
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/forum
          file: ./services/forum/Containerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=forum-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forum-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-forum
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r TAG; do
            docker buildx imagetools create \
              -t "${TAG}" \
              "${TAG}-amd64" \
              "${TAG}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
