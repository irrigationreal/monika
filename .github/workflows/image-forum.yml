name: Image / Forum

on:
  push:
    branches: [main]
    paths:
      - "services/forum/Containerfile"
      - "services/forum/.dockerignore"
      - "services/forum/package.json"
      - "services/forum/pnpm-lock.yaml"
      - "services/forum/pnpm-workspace.yaml"
      - "services/forum/apps/**"
      - "services/forum/packages/**"
      - "services/forum/tsconfig.json"
      - ".github/workflows/image-forum.yml"

concurrency:
  group: image-forum-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: build-meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-forum
          tags: |
            type=raw,value=main,suffix=-${{ matrix.arch }}
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./services/forum
          file: ./services/forum/Containerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MONIKA_BUILD_COMMIT=${{ github.sha }}
            MONIKA_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MONIKA_BUILD_DATE=${{ steps.build-meta.outputs.date }}
          cache-from: type=gha,scope=forum-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forum-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-forum
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r TAG; do
            docker buildx imagetools create \
              -t "${TAG}" \
              "${TAG}-amd64" \
              "${TAG}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
