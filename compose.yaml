# Host mode deployment on stanza
# Usage: docker compose up -d
# Interactive: docker exec -it monika pi

services:
  monika:
    image: ghcr.io/irrigationreal/monika:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: monika
    restart: unless-stopped
    network_mode: host
    volumes:
      # State: sessions, memories, auth, memstore DB
      - /home/monika/.pi:/home/monika/.pi
      # File access for read/write/edit/grep tools
      - /home/monika:/home/monika
      - /persist:/persist
      - /tmp:/tmp
      # SSH key for host-shell wrapper
      - /persist/keys:/persist/keys:ro
      # Secrets (API keys, tokens)
      - /home/monika/.config:/home/monika/.config:ro
      # GPG keyring for git signing inside the container
      - /home/monika/.config/gnupg:/root/.gnupg:ro
    environment:
      HOME: /home/monika
      XDG_RUNTIME_DIR: /run/user/1002
      MEMSTORE_SOCKET: /home/monika/.pi/memstore/memstore.sock
      MONIKA_HOST_MODE: "1"
      RELOCATE_TARGET: monika@127.0.0.1:/home/monika
      GNUPGHOME: /root/.gnupg
      GIT_USER_NAME: Monika
      GIT_USER_EMAIL: monika@neosynth.net
    env_file:
      - /home/monika/.config/secrets.env
