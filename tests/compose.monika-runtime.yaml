# Test-only standalone runtime compose file.
# Usage from repo root:
#   docker compose -f tests/compose.monika-runtime.yaml up -d
#   docker exec -it monika-test pi

services:
  monika-test:
    build:
      context: ..
      dockerfile: Containerfile
    container_name: monika-test
    volumes:
      - monika-test-data:/data
      - monika-test-agentlogs:/agentlogs-home
    environment:
      HOME: /app
      PI_CODING_AGENT_DIR: /app/.pi/agent
      PI_OFFLINE: "1"
      PI_SUBAGENT_EXECUTION_TARGET_ROOT: /tmp/pi-subagent-test-targets
      PI_SUBAGENT_SSH_LOCK_EXTENSION: /app/.pi/agent/extensions/ssh.ts
      MONIKA_SSH_LOCK_DESCRIPTOR: ""
      MEMSTORE_SOCKET: /tmp/memstore.sock
      POOL_CONFIG_URL: ${POOL_CONFIG_URL:-}
      AGENTLOGS_HOME: /agentlogs-home

volumes:
  monika-test-agentlogs:
  monika-test-data:
